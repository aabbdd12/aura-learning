": {"fr": "un ménage", "en": "a household"}, "ok": true, "why": {"fr": "Exact. Une ligne, c'est un ménage, avec sa taille et le sexe de son chef. Nos moyennes parleront donc de ménages.", "en": "Right. A row is a household, with its size and the sex of its head. So our means will speak of households."}}, {"label": "C", "text": {"fr": "un village", "en": "a village"}, "ok": false, "why": {"fr": "Un village aurait des dizaines de ménages, et plusieurs chefs. Ici, chaque ligne n'a qu'un chef.", "en": "A village would have dozens of households, and several heads. Here, each row has only one head."}}], "wrong": [], "near": [], "solution": []}, "bysex": {"kind": "fill", "ask": {"fr": "Comparer la taille des ménages (<code>size<\/code>) selon le sexe du chef (<code>sex<\/code>) :", "en": "Compare the size of the households (<code>size<\/code>) by the sex of the head (<code>sex<\/code>):"}, "choices": [], "wrong": [{"value": "zone", "why": {"fr": "Avec zone, vous compareriez la ville et la campagne. Ici, les groupes sont faits par le sexe du chef.", "en": "With zone, you would compare town and countryside. Here, the groups are made by the sex of the head."}}, {"value": "size", "why": {"fr": "size est ce que l'on résume. Il faut la variable qui fait les groupes.", "en": "size is what we summarize. We need the variable that makes the groups."}}, {"value": "Sex", "why": {"fr": "Presque : une majuscule et une minuscule sont deux lettres différentes. Essayez avec un petit s.", "en": "Almost: a capital and a small letter are two different letters. Try with a small s."}}, {"value": "*", "why": {"fr": "Il faut le nom de la variable qui donne le sexe du chef de ménage.", "en": "We need the name of the variable that gives the sex of the head of the household."}}], "near": [], "solution": [], "text": "summarize size, over(____)", "accept": "sex", "show": "bysex", "right": {"fr": "Exact. Les ménages dirigés par une femme sont deux fois plus petits.", "en": "Right. The households headed by a woman are half as large."}}, "fsize": {"kind": "number", "ask": {"fr": "La taille moyenne des ménages dirigés par une femme :", "en": "The mean size of the households headed by a woman:"}, "choices": [], "wrong": [{"value": "*", "why": {"fr": "Pas encore. Lancez summarize size, over(sex), et lisez la colonne Mean, à la ligne Female.", "en": "Not yet. Run summarize size, over(sex), and read the column Mean, at the row Female."}}], "near": [{"value": 7.837, "why": {"fr": "C'est la taille des ménages dirigés par un homme. Regardez la ligne Female.", "en": "That is the size of the households headed by a man. Look at the row Female."}}, {"value": 7.491, "why": {"fr": "C'est la moyenne de tous les ménages. Il manque l'option over(sex).", "en": "That is the mean of all the households. The option over(sex) is missing."}}], "solution": ["summarize size, over(sex)"], "data": "bkf98I.dta", "vars": {"fr": "taille <code>size<\/code>, sexe du chef <code>sex<\/code>", "en": "size <code>size<\/code>, sex of the head <code>sex<\/code>"}, "answer": 3.898, "tolerance": "0.05", "right": {"fr": "Exact, c'est bien le nombre que trouve AURA.", "en": "Right, this is the number AURA finds."}}}, "pages": {"fr": [{"no": 1, "title": "Une question, dix minutes", "items": [{"kind": "table", "at": [1, 0], "name": "first", "hl": [[2, "zone"]]}, {"kind": "point", "at": [1, 0], "html": "Burkina Faso, 1998 : <b>8 478 ménages<\/b> enquêtés"}, {"kind": "point", "at": [2, 0], "html": "À la campagne, dépense-t-on moins qu'en ville ?"}, {"kind": "point", "at": [3, 0], "html": "Cinq lignes pour répondre. Rien à retenir aujourd'hui"}]}, {"no": 2, "title": "AURA, en quatre verbes", "items": [{"kind": "cards", "at": [1, 0], "cards": [[1, "Lire", "Excel, texte, Stata, SPSS, une adresse Internet"], [2, "Calculer", "d'une moyenne aux méthodes des chercheurs"], [3, "Dessiner", "un graphique en une ligne, retouché à la souris"], [4, "Garder", "chaque action devient une ligne que l'on peut refaire"]]}]}, {"no": 3, "title": "L'installer", "items": [{"kind": "cards", "at": [1, 0], "cards": [[1, "Télécharger", "<b>aabbdd12.github.io/aura<\/b>, page Download. Un seul fichier, pour Windows 10 ou 11"], [2, "Installer", "rien d'autre à ajouter, tout est dans la boîte"], [3, "Ouvrir", "par le menu de Windows. Version : <b>Help &gt; About<\/b>"]]}]}, {"no": 4, "title": "Ouvrir des données", "items": [{"kind": "scene", "at": [1, 0], "name": "open"}, {"kind": "point", "at": [1, 0], "html": "La fenêtre d'AURA"}, {"kind": "point", "at": [2, 0], "html": "<code><i class=\"sy-c\">use<\/i><\/code> et le nom du fichier"}, {"kind": "point", "at": [3, 0], "html": "Workspace : 8 478 lignes, 14 variables"}, {"kind": "point", "at": [4, 0], "html": "Une variable est une <b>colonne<\/b> : <code>exppc<\/code>, la dépense par personne"}]}, {"no": 5, "title": "Devinez : une ligne, c'est qui ?", "items": [{"kind": "table", "at": [1, 0], "name": "first", "hl": [[2, "size"]]}, {"kind": "point", "at": [1, 0], "html": "Six lignes du fichier"}, {"kind": "point", "at": [2, 0], "html": "<code>size<\/code> : la taille du ménage ; <code>sex<\/code> : le sexe de son chef"}, {"kind": "quiz", "at": [3, 0], "name": "row"}]}, {"no": 6, "title": "Un premier nombre", "items": [{"kind": "scene", "at": [1, 0], "name": "sum"}, {"kind": "point", "at": [1, 0], "html": "<code><i class=\"sy-c\">summarize<\/i> exppc<\/code>"}, {"kind": "point", "at": [2, 0], "html": "Obs : 8 478 ménages"}, {"kind": "point", "at": [3, 0], "html": "Mean : <b>190 847<\/b> francs CFA par personne et par an"}, {"kind": "point", "at": [4, 0], "html": "Une moyenne mélange tout"}]}, {"no": 7, "title": "Ville et campagne", "items": [{"kind": "scene", "at": [1, 0], "name": "over"}, {"kind": "point", "at": [1, 0], "html": "Une virgule, une <b>option<\/b> : <code>over(zone)<\/code>"}, {"kind": "point", "at": [2, 0], "html": "Campagne : <b>117 725<\/b>"}, {"kind": "point", "at": [3, 0], "html": "Ville : <b>356 804<\/b>"}, {"kind": "point", "at": [4, 0], "html": "<b>3,0 fois plus<\/b> en ville"}]}, {"no": 8, "title": "Une image", "items": [{"kind": "image", "at": [2, 0], "name": "graph_zone.png"}, {"kind": "code", "at": [1, 0], "text": "graph bar (mean) exppc, over(zone)"}, {"kind": "point", "at": [1, 0], "html": "La même option"}, {"kind": "point", "at": [2, 0], "html": "La réponse se voit"}, {"kind": "point", "at": [3, 0], "html": "À la souris : <b>Start Graph Editor<\/b>"}, {"kind": "point", "at": [4, 0], "html": "Enregistrer pour un rapport"}]}, {"no": 9, "title": "Une erreur est une aide", "items": [{"kind": "scene", "at": [1, 0], "name": "err"}, {"kind": "point", "at": [1, 0], "html": "Une faute, exprès : <code>exppC<\/code>"}, {"kind": "point", "at": [2, 0], "html": "Rien n'est cassé"}, {"kind": "point", "at": [3, 0], "html": "Le message propose : « Did you mean <code>exppc<\/code>? »"}, {"kind": "point", "at": [4, 0], "html": "Reprendre la ligne dans <b>Review<\/b>"}]}, {"no": 10, "title": "À vous", "items": [{"kind": "point", "at": [1, 0], "html": "Ici : complétez la commande"}, {"kind": "fill", "at": [1, 0], "name": "bysex"}, {"kind": "point", "at": [2, 0], "html": "Dans AURA : la taille des ménages dirigés par une femme"}, {"kind": "number", "at": [2, 0], "name": "fsize"}, {"kind": "point", "at": [3, 0], "html": "Recopiez votre résultat"}]}], "en": [{"no": 1, "title": "A question, ten minutes", "items": [{"kind": "table", "at": [1, 0], "name": "first", "hl": [[2, "zone"]]}, {"kind": "point", "at": [1, 0], "html": "Burkina Faso, 1998: <b>8,478 households<\/b> surveyed"}, {"kind": "point", "at": [2, 0], "html": "Do people spend less in the countryside than in town?"}, {"kind": "point", "at": [3, 0], "html": "Five lines to answer. Nothing to remember today"}]}, {"no": 2, "title": "AURA, in four verbs", "items": [{"kind": "cards", "at": [1, 0], "cards": [[1, "Read", "Excel, text, Stata, SPSS, a web address"], [2, "Compute", "from a mean to the methods of researchers"], [3, "Draw", "a graph in one line, retouched with the mouse"], [4, "Keep", "every action becomes a line that can be done again"]]}]}, {"no": 3, "title": "Install it", "items": [{"kind": "cards", "at": [1, 0], "cards": [[1, "Download", "<b>aabbdd12.github.io/aura<\/b>, page Download. A single file, for Windows 10 or 11"], [2, "Install", "nothing to add, everything is in the box"], [3, "Open", "from the Windows menu. Version: <b>Help &gt; About<\/b>"]]}]}, {"no": 4, "title": "Open data", "items": [{"kind": "scene", "at": [1, 0], "name": "open"}, {"kind": "point", "at": [1, 0], "html": "The window of AURA"}, {"kind": "point", "at": [2, 0], "html": "<code><i class=\"sy-c\">use<\/i><\/code> and the name of the file"}, {"kind": "point", "at": [3, 0], "html": "Workspace: 8,478 rows, 14 variables"}, {"kind": "point", "at": [4, 0], "html": "A variable is a <b>column<\/b>: <code>exppc<\/code>, the spending per person"}]}, {"no": 5, "title": "Guess: who is a row?", "items": [{"kind": "table", "at": [1, 0], "name": "first", "hl": [[2, "size"]]}, {"kind": "point", "at": [1, 0], "html": "Six rows of the file"}, {"kind": "point", "at": [2, 0], "html": "<code>size<\/code>: the household size; <code>sex<\/code>: the sex of its head"}, {"kind": "quiz", "at": [3, 0], "name": "row"}]}, {"no": 6, "title": "A first number", "items": [{"kind": "scene", "at": [1, 0], "name": "sum"}, {"kind": "point", "at": [1, 0], "html": "<code><i class=\"sy-c\">summarize<\/i> exppc<\/code>"}, {"kind": "point", "at": [2, 0], "html": "Obs: 8,478 households"}, {"kind": "point", "at": [3, 0], "html": "Mean: <b>190,847<\/b> CFA francs per person and per year"}, {"kind": "point", "at": [4, 0], "html": "A mean mixes everything"}]}, {"no": 7, "title": "Town and countryside", "items": [{"kind": "scene", "at": [1, 0], "name": "over"}, {"kind": "point", "at": [1, 0], "html": "A comma, an <b>option<\/b>: <code>over(zone)<\/code>"}, {"kind": "point", "at": [2, 0], "html": "Countryside: <b>117,725<\/b>"}, {"kind": "point", "at": [3, 0], "html": "Town: <b>356,804<\/b>"}, {"kind": "point", "at": [4, 0], "html": "<b>3.0 times more<\/b> in town"}]}, {"no": 8, "title": "A picture", "items": [{"kind": "image", "at": [2, 0], "name": "graph_zone.png"}, {"kind": "code", "at": [1, 0], "text": "graph bar (mean) exppc, over(zone)"}, {"kind": "point", "at": [1, 0], "html": "The same option"}, {"kind": "point", "at": [2, 0], "html": "The answer can be seen"}, {"kind": "point", "at": [3, 0], "html": "With the mouse: <b>Start Graph Editor<\/b>"}, {"kind": "point", "at": [4, 0], "html": "Save it for a report"}]}, {"no": 9, "title": "An error is a help", "items": [{"kind": "scene", "at": [1, 0], "name": "err"}, {"kind": "point", "at": [1, 0], "html": "A mistake, on purpose: <code>exppC<\/code>"}, {"kind": "point", "at": [2, 0], "html": "Nothing is broken"}, {"kind": "point", "at": [3, 0], "html": "The message suggests: \"Did you mean <code>exppc<\/code>?\""}, {"kind": "point", "at": [4, 0], "html": "Take the line again in <b>Review<\/b>"}]}, {"no": 10, "title": "Your turn", "items": [{"kind": "point", "at": [1, 0], "html": "Here: complete the command"}, {"kind": "fill", "at": [1, 0], "name": "bysex"}, {"kind": "point", "at": [2, 0], "html": "In AURA: the size of the households headed by a woman"}, {"kind": "number", "at": [2, 0], "name": "fsize"}, {"kind": "point", "at": [3, 0], "html": "Copy your result"}]}]}, "end": {"fr": {"title": "À retenir", "points": ["Une question, une ligne, une réponse.", "Une moyenne parle de ce qu'est une ligne : ici, un ménage.", "Après la virgule viennent les options ; <code>over()<\/code> sépare les groupes.", "Un message d'erreur contient souvent la solution.", "Tout ce que l'on fait est gardé."]}, "en": {"title": "To remember", "points": ["A question, a line, an answer.", "A mean speaks of what a row is: here, a household.", "After the comma come the options; <code>over()<\/code> separates the groups.", "An error message often contains the solution.", "Everything we do is kept."]}}, "script": {"fr": {"1": "[1] Voici une vraie enquête. En 1998, au Burkina Faso, des enquêteurs ont rendu visite à 8 478 ménages. Ils ont noté où ils vivent, combien ils sont, et ce qu'ils dépensent. Vous voyez six lignes du fichier. Pour l'instant, ce ne sont que des chiffres. [2] Nous avons une question. À la campagne, dépense-t-on moins qu'en ville ? Vous avez sans doute une idée. Mais une idée n'est pas une réponse. De combien, moins ? Deux fois moins ? Dix fois moins ? [3] Dans dix minutes, vous aurez le chiffre, un graphique, et vous saurez les refaire. Il faudra cinq lignes, pas davantage. Cette séance est une visite. Ne cherchez pas à tout retenir : chaque chose sera reprise, une par une, dans les séances qui suivent. Regardez seulement comment une question devient une réponse.", "2": "[1] AURA est un logiciel d'analyse de données. Il lit d'abord vos données, d'où qu'elles viennent : un tableau Excel, un fichier texte, un fichier d'un autre logiciel, ou une adresse sur Internet. [2] Ensuite, il calcule. Cela va de la simple moyenne jusqu'aux méthodes des chercheurs : enquêtes, pauvreté, régressions. Il n'est pas nécessaire de tout connaître pour commencer. [3] Il dessine. Un graphique se fait en une ligne, et se retouche à la souris. [4] Et surtout, il garde tout. Chaque action, même faite à la souris, devient une ligne que l'on peut relire, corriger et refaire. C'est ce qui sépare un outil d'analyse d'une calculatrice : dans six mois, vous pourrez montrer comment vous avez trouvé votre nombre. Enfin, AURA est libre et gratuit. Il s'appuie sur des bibliothèques scientifiques utilisées dans le monde entier.", "3": "[1] Pour l'installer, allez sur le site d'AURA, à la page Download. C'est un seul fichier, d'environ 250 mégaoctets. Il faut un ordinateur sous Windows 10 ou Windows 11. [2] Lancez ce fichier. Windows peut afficher un avertissement, parce que le fichier n'est pas signé par un éditeur enregistré. Vérifiez qu'il vient bien du site d'AURA, puis choisissez de continuer. Il n'y a rien d'autre à installer : tout est dans la boîte. [3] Ouvrez AURA par le menu de Windows. La toute première ouverture est un peu longue, le temps de charger ses outils. Les suivantes sont plus rapides. Si AURA est déjà sur votre ordinateur, regardez sa version dans le menu Help, puis About. Ce cours est fait avec la version un point huit. Vous n'avez pas AURA sous la main ? Suivez quand même : tout est montré à l'écran.", "4": "[1] Voici AURA. À droite, cette grande page blanche recevra les résultats. En bas, une case attend une commande. À gauche, quatre panneaux, encore vides. [2] Écrivons. Use, c'est-à-dire : utilise. Puis le nom du fichier. Si vous préférez la souris, le menu File, puis Open, fait la même chose. [3] Nous appuyons sur Entrée. Regardez le panneau Workspace : le fichier est là, avec 8 478 lignes et 14 variables. L'étoile dit que c'est lui que l'on regarde en ce moment. [4] Juste en dessous, la liste des variables. Une variable, c'est une colonne du tableau. Chacune a un nom court, et souvent une étiquette qui l'explique. Celle qui nous intéresse s'appelle exppc : la dépense par personne. Rien n'a été calculé, rien n'a été changé. Nous avons seulement ouvert un livre.", "5": "[1] Avant de calculer, une question que l'on oublie souvent. Voici de nouveau nos six lignes. Chaque ligne porte un code de zone, un sexe, une taille, une dépense. [2] Size est la taille du ménage : le nombre de personnes qui vivent ensemble. Sex est le sexe du chef de ménage. [3] Alors, une ligne de ce tableau, c'est qui ? Une personne ? Un ménage ? Un village ? Cela change tout. Si une ligne était une personne, nous aurions 8 478 personnes. Si c'est un ménage, elles sont bien plus nombreuses. Une moyenne calculée sur un fichier parle toujours de ce qu'est une ligne de ce fichier. Beaucoup d'erreurs d'interprétation viennent de là, et aucun logiciel ne peut les éviter à votre place. Choisissez votre réponse.", "6": "[1] Posons une première question à AURA : combien dépense-t-on, en moyenne ? La commande s'appelle summarize : résume. Pendant que l'on tape, AURA propose la suite en gris, et le mot devient bleu quand il le connaît. Puis vient le nom de la variable. [2] Le résultat arrive aussitôt. Approchons-nous, et lisons de gauche à droite. Obs, c'est le nombre de ménages utilisés : 8 478. Aucun ne manque. [3] Mean, c'est la moyenne : 190 847 francs CFA, par personne et par an. Vient ensuite l'écart-type, qui dit si les ménages se ressemblent. Il est 2,2 fois plus grand que la moyenne : ils ne se ressemblent pas du tout. [4] Enfin, le plus petit et le plus grand. Le plus grand dépasse 17 millions. Une moyenne cache donc beaucoup de choses. Ici, elle mélange des ménages très différents, et d'abord la ville et la campagne. Séparons-les.", "7": "[1] Il suffit d'ajouter une option. Après la virgule, over, et entre parenthèses, la variable qui fait les groupes : zone. Une commande, une virgule, des options : toutes les commandes d'AURA sont faites ainsi. [2] Voici deux groupes au lieu d'un. À la campagne, 117 725 francs par personne. [3] En ville, 356 804. [4] Voilà notre réponse : en ville, on dépense 3,0 fois plus par personne. Soyons honnêtes sur ce que dit ce nombre. C'est une moyenne de ménages, tous comptés de la même façon, alors qu'un ménage enquêté en représente parfois des centaines d'autres. Les pondérations, au chapitre cinq, en tiendront compte. Et une moyenne ne dit pas que chaque ménage de la campagne dépense peu : elle résume un groupe, elle ne décrit personne.", "8": "[1] Un nombre se lit, une image se voit. Une seule ligne suffit : graph bar, la moyenne de la dépense, et de nouveau, over zone. [2] Deux barres. La question du début a maintenant une réponse que l'on peut montrer à n'importe qui, sans explication. [3] Dans AURA, ce graphique s'ouvre dans sa propre fenêtre. Un bouton, Start Graph Editor, permet de changer un titre, une couleur, une police, à la souris. Chaque geste, là encore, écrit une option. [4] Et il s'enregistre en image pour un rapport, ou sous une forme que l'on pourra retoucher plus tard. Retenez seulement la ressemblance. Summarize et graph bar ont répondu à la même question, avec la même option. Quand on connaît la forme d'une commande, on en connaît beaucoup d'autres. C'est l'idée du chapitre trois.", "9": "[1] Faisons maintenant une faute, exprès. Nous écrivons exppc avec un C majuscule à la fin. [2] AURA refuse, et un message rouge s'affiche. Beaucoup de débutants s'inquiètent à ce moment-là. Il ne faut pas : rien n'est cassé, rien n'est perdu, les données n'ont pas bougé. [3] Lisons le message. Un code, r 111. Puis une phrase : la variable n'a pas été trouvée. Et une proposition : vouliez-vous dire exppc, avec un petit c ? Dans un nom de variable, une majuscule et une minuscule sont deux lettres différentes. [4] Il suffit de corriger. Cliquez sur la commande dans Review : elle revient dans la case. Changez une lettre, et appuyez sur Entrée. Vous ferez des dizaines d'erreurs comme celle-ci, comme tout le monde. Lisez toujours le message : bien souvent, il contient la solution.", "10": "[1] À vous. Première étape, ici même. On veut comparer la taille des ménages selon le sexe de leur chef. La commande est presque écrite : il manque le nom de la variable qui fait les groupes. Pensez à ce que nous avons fait avec la zone. [2] Deuxième étape, dans AURA. Copiez la ligne qui ouvre les données, collez-la dans la case de commande, et appuyez sur Entrée. Puis lancez la commande que vous venez de compléter. Lisez la taille moyenne des ménages dirigés par une femme. [3] Recopiez ce nombre ici. Si vous obtenez un message d'erreur, relisez-le : il vous dira sans doute ce qui manque. Après deux essais, un bouton montrera la solution. Le plus important est d'avoir essayé.", "end": "Vous avez ouvert une enquête, calculé une moyenne, comparé deux groupes, vu un graphique, et lu un message d'erreur. Vous connaissez déjà la forme de tout le cours : une question, une ligne, une réponse. À la prochaine séance, nous regarderons la fenêtre d'AURA, partie par partie."}, "en": {"1": "[1] Here is a real survey. In 1998, in Burkina Faso, interviewers visited 8,478 households. They wrote down where they live, how many they are, and what they spend. You see six rows of the file. For now, they are only digits. [2] We have a question. Do people spend less in the countryside than in town? You probably have an idea. But an idea is not an answer. How much less? Twice less? Ten times less? [3] In ten minutes, you will have the number, a graph, and you will know how to make them again. It will take five lines, no more. This session is a visit. Do not try to remember everything: each thing will come back, one at a time, in the sessions that follow. Just watch how a question becomes an answer.", "2": "[1] AURA is a program for data analysis. First, it reads your data, wherever they come from: an Excel sheet, a text file, a file of another program, or an address on the Internet. [2] Then it computes. This goes from a simple mean to the methods of researchers: surveys, poverty, regressions. There is no need to know everything in order to begin. [3] It draws. A graph takes one line, and is retouched with the mouse. [4] And above all, it keeps everything. Every action, even one made with the mouse, becomes a line that can be read, corrected, and done again. This is what separates a tool for analysis from a calculator: in six months, you will be able to show how you found your number. Finally, AURA is free and open. It rests on scientific libraries used all over the world.", "3": "[1] To install it, go to the site of AURA, on the page Download. It is a single file, of about 250 megabytes. You need a computer under Windows 10 or Windows 11. [2] Run this file. Windows may show a warning, because the file is not signed by a registered publisher. Check that it does come from the site of AURA, then choose to go on. There is nothing else to install: everything is in the box. [3] Open AURA from the Windows menu. The very first opening is a little long, the time to load its tools. The next ones are faster. If AURA is already on your computer, look at its version in the menu Help, then About. This course is made with version one point eight. You do not have AURA at hand? Follow anyway: everything is shown on the screen.", "4": "[1] Here is AURA. On the right, this large white page will receive the results. At the bottom, a box is waiting for a command. On the left, four panels, still empty. [2] Let us write. Use, and the name of the file. If you prefer the mouse, the menu File, then Open, does the same thing. [3] We press Enter. Look at the panel Workspace: the file is there, with 8,478 rows and 14 variables. The star says that it is the one we are looking at now. [4] Just below, the list of the variables. A variable is a column of the table. Each one has a short name, and often a label that explains it. The one we care about is called exppc: the spending per person. Nothing was computed, nothing was changed. We have only opened a book.", "5": "[1] Before computing, a question that is often forgotten. Here are our six rows again. Each row carries a code for the area, a sex, a size, an amount spent. [2] Size is the size of the household: the number of people living together. Sex is the sex of the head of the household. [3] So, who is a row of this table? A person? A household? A village? It changes everything. If a row were a person, we would have 8,478 people. If it is a household, they are many more. A mean computed on a file always speaks of what a row of that file is. Many wrong readings come from there, and no program can avoid them for you. Choose your answer.", "6": "[1] Let us ask AURA a first question: how much do people spend, on average? The command is called summarize. While we type, AURA suggests the rest in gray, and the word becomes blue when AURA knows it. Then comes the name of the variable. [2] The result comes at once. Let us come closer, and read from left to right. Obs is the number of households used: 8,478. None is missing. [3] Mean is the mean: 190,847 CFA francs, per person and per year. Then comes the standard deviation, which says whether the households look alike. It is 2.2 times larger than the mean: they do not look alike at all. [4] Finally, the smallest and the largest. The largest is above 17 million. So a mean hides many things. Here, it mixes very different households, and first of all the town and the countryside. Let us separate them.", "7": "[1] We only have to add an option. After the comma, over, and between parentheses, the variable that makes the groups: zone. A command, a comma, some options: all the commands of AURA are made this way. [2] Here are two groups instead of one. In the countryside, 117,725 francs per person. [3] In town, 356,804. [4] This is our answer: in town, people spend 3.0 times more per person. Let us be honest about what this number says. It is a mean of households, all counted in the same way, while one surveyed household sometimes stands for hundreds of others. The weights, in chapter five, will take this into account. And a mean does not say that every household of the countryside spends little: it sums up a group, it describes nobody.", "8": "[1] A number is read, a picture is seen. One line is enough: graph bar, the mean of the spending, and again, over zone. [2] Two bars. The question of the beginning now has an answer that we can show to anyone, without explanation. [3] In AURA, this graph opens in a window of its own. A button, Start Graph Editor, lets you change a title, a color, a font, with the mouse. Each gesture, here again, writes an option. [4] And it can be saved as a picture for a report, or in a form that can be retouched later. Just remember how much they look alike. Summarize and graph bar answered the same question, with the same option. When we know the form of one command, we know many others. This is the idea of chapter three.", "9": "[1] Let us now make a mistake, on purpose. We write exppc with a capital C at the end. [2] AURA refuses, and a red message appears. Many beginners worry at this moment. There is no reason to: nothing is broken, nothing is lost, the data did not move. [3] Let us read the message. A code, r 111. Then a sentence: the variable was not found. And a suggestion: did you mean exppc, with a small c? In the name of a variable, a capital and a small letter are two different letters. [4] We only have to correct. Click on the command in Review: it comes back into the box. Change one letter, and press Enter. You will make dozens of mistakes like this one, as everybody does. Always read the message: very often, it contains the solution.", "10": "[1] Your turn. First step, right here. We want to compare the size of the households by the sex of their head. The command is almost written: the name of the variable that makes the groups is missing. Think of what we did with the area. [2] Second step, in AURA. Copy the line that opens the data, paste it in the command box, and press Enter. Then run the command you have just completed. Read the mean size of the households headed by a woman. [3] Copy this number here. If you get an error message, read it again: it will probably tell you what is missing. After two tries, a button will show the solution. What matters most is to have tried.", "end": "You have opened a survey, computed a mean, compared two groups, seen a graph, and read an error message. You already know the shape of the whole course: a question, a line, an answer. In the next session, we will look at the window of AURA, part by part."}}, "images": {"start": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABcIAAAQcCAMAAACBExgNAAADAFBMVEX//////9v//7bb///b/9C2//+2/8L09vr09vnz9vr09fr09fn09fjz9frz9fnz9fjz9Pjy9fry9fny9fjx9fny9Pnw9Pjx8/jz9Pfy8vTy8vLw8vby8fLx8PHw8PDz89nu9Pnv8/fv8ffu8ffu8fbu8dnu8bzp8fXU8fW98fXv7vHp7vXs6u/s5uzm5ubi6u/t5Ojl5eXi5Ofb4u/   }
  if (done) {
    playing = false; seen[page] = 1; keep(); setMark(last(page)); caption(""); light(-1); buttons(); dots();
    finished();
    return;
  }
  if (segs[i].m !== mark) setMark(segs[i].m);
  caption(segs[i].t); light(i);
  const me = run; began = performance.now();
  say(segs[i].t, () => { if (me !== run) return; learn(segs[i].t, performance.now() - began); step(i + 1); });
}

/* ── the time spent and the time of the session ──
   Fixed for a language, a voice and a speed: each sentence has its time, from its length and the pace of
   the voice; the pace is measured once, over the first minutes heard with a voice, then kept for good. */
let began = 0, pace = 64;                                      /* pace: ms a letter, at the speed 1 */
const letters = t => { const s = spoken(t); return s.length + 3 * (s.match(/\d/g) || []).length + 6; };   /* + the pause after a sentence */
const voiceName = () => { const v = voiceOf(); return v ? v.name : ""; };
const heardKey = () => "heard-" + $("lang").value + "-" + voiceName();
function heard() { try { return JSON.parse(pref.get(heardKey())) || { l: 0, ms: 0 }; } catch (e) { return { l: 0, ms: 0 }; } }
let settled = "";
function settle() {                                            /* at the opening, and for another language or voice: never during the reading */
  if (settled === heardKey()) return;
  settled = heardKey();
  const h = heard(), old = +pref.get("pace-" + $("lang").value + "-" + voiceName());
  pace = h.l >= 600 ? h.ms / h.l : old ? old / 5.9 : 64;
}
const ms = t => pace * letters(t) / +$("rate").value;
function learn(t, spent) {
  const h = heard(), n = letters(t), p = spent * +$("rate").value / n;
  if (h.l >= 2500 || n < 30 || !synth || !$("voice").value || p < 25 || p > 160) return;
  pref.set(heardKey(), JSON.stringify({ l: h.l + n, ms: Math.round(h.ms + spent * +$("rate").value) }));
}
const textOf = i => { if (i >= N) return D.script[$("lang").value].end; let o = null; try { o = JSON.parse(mem.get("p" + (i + 1) + "-" + $("lang").value)); } catch (e) {} return o ? o.text : D.script[$("lang").value][String(i + 1)]; };
const span = list => list.reduce((a, x) => a + ms(x.t), 0) + 900;
function clock() {
  const all = [...Array(N + 1).keys()].map(i => parse(textOf(i))), spans = all.map(span), at = Math.min(page, N);
  let now = 0;
  if (at >= 0) { const list = all[at], k = Math.min(si, list.length);
    now = spans.slice(0, at).reduce((a, x) => a + x, 0) + list.slice(0, k).reduce((a, x) => a + ms(x.t), 0) + (playing && k < list.length ? Math.min(performance.now() - began, ms(list[k].t)) : 0);
    if (!playing && !waiting && at < N && seen[at] && !segs.length) now = spans.slice(0, at).reduce((a, x) => a + x, 0); }
  if (page >= N && si >= all[N].length) now = spans.reduce((a, x) => a + x, 0);      /* at the end: all of it */
  const f = v => { const t = Math.round(v / 1000); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };
  $("time").textContent = f(now) + " / " + f(spans.reduce((a, x) => a + x, 0));
}
setInterval(clock, 500);
function finished() {                                          /* the page is read: the next one, after some time for the exercises left */
  if (!cont()) return;
  const own = kindOf(page, ["fill", "number"]), next = () => go(page + 1, true);
  if (own.some(q => !solved[q.name])) { if (!touched) countdown(45, next); else buttons(); }      /* begun: the page waits */
  else if (own.length) countdown(12, next);                    /* some time to read the answer */
  else timer = setTimeout(next, 900);
}
let counting = false;
function countdown(n, then) {                                  /* on the button; a gesture in the page stops it */
  counting = true; face("play", T("skip"), `${T("skip")} (${n})`);
  timer = setTimeout(() => { if (!counting) return; if (n > 1) countdown(n - 1, then); else { counting = false; then(); } }, 1000);
}
const ended = () => cont() && page >= 0 && page < N && segs.length > 0 && si >= segs.length;      /* read to its end */
function hold() { if (counting) { counting = false; clearTimeout(timer); buttons(); } }
let touched = false;                                           /* the page is being answered */
for (const e of ["pointerdown", "focusin", "keydown", "input"]) $("slide").addEventListener(e, () => { touched = true; hold(); }, true);
window.addEventListener("blur", () => { if (page >= 0 && page < N && kindOf(page, ["fill", "number"]).length) { touched = true; hold(); } });   /* gone to AURA for the exercise */
const skipped = {};
function stop() { run++; playing = false; counting = false; clearTimeout(timer); doorT.forEach(clearTimeout); doorT = []; all("#slide .m").forEach(e => { if (e.item && e.item.kind === "scene") film(e, e.item, mark); }); if (synth) synth.cancel(); if (mg) { mg.disconnect(); mg = null; } buttons(); }
function buttons() {
  clock();
  if (playing) face("pause", T("pause")); else if (page < 0) face("play", T("start"), T("start")); else if (page >= N) face("again", T("again"));
  else if (waiting || ended()) face("play", T("skip"), T("skip")); else face("play", si > 0 && si < segs.length ? T("resume") : T("listen"));
  $("prev").disabled = page < 0; $("next").disabled = page >= N; $("scr").disabled = page < 0 || page >= N;
}

/* ── the script and its editing ── */
function key() { return "p" + (page + 1) + "-" + $("lang").value; }
function original() { return D.script[$("lang").value][String(page + 1)]; }
function own() { try { return JSON.parse(mem.get(key())); } catch (e) { return null; } }
function scriptOf() { const o = own(); return o ? o.text : original(); }
function parse(text) {                                        /* "[1] a. b. [2] c." -> sentences with their mark */
  const out = []; let cur = 0;
  text.split(/(\[\d+\])/).forEach(p => {
    const m = /^\[(\d+)\]$/.exec(p.trim());
    if (m) { cur = +m[1]; return; }
    p.replace(/([.!?…])\s+(?=[A-ZÀ-Ý«"])/g, "$1\u0001").split("\u0001").forEach(x => { if (x.trim()) out.push({ m: cur, t: x.trim() }); });
  });
  return out;
}
function drawScript() {
  const box = $("script"); box.hidden = !showScript || page < 0 || page >= N; if (box.hidden) return;
  const n = last(page);
  if (editing) {
    box.innerHTML = `<p><b>${T("edt")}</b> <span class="mk">${fmt(T("keep"), n)}</span></p><textarea id="ed"></textarea><p class="err" id="er"></p><button id="sv" class="main">${T("save")}</button> <button id="cl">${T("cancel")}</button>`;
    $("ed").value = scriptOf();
    $("sv").onclick = () => {
      const t = $("ed").value.trim(), miss = []; for (let k = 1; k <= n; k++) if (!t.includes("[" + k + "]")) miss.push("[" + k + "]");
      if (!t || miss.length) { $("er").textContent = t ? T("miss") + miss.join(" ") : T("empty"); return; }
      mem.set(key(), t === original() ? null : JSON.stringify({ text: t, base: original() })); editing = false; segs = parse(scriptOf()); si = 0; drawScript(); buttons(); };
    $("cl").onclick = () => { editing = false; drawScript(); };
    return;
  }
  const o = own();
  box.innerHTML = `<p class="bar"><b>${o ? T("mine") : T("script")}</b> <span class="mk">${o && o.base !== original() ? T("changed") : T("click")}</span> <button id="edb">${T("edit")}</button>${o ? `<button id="rs">${T("orig")}</button>` : ""}</p><div>${segs.map((s, i) => `<span class="s" data-i="${i}">${esc(s.t)}</span> `).join("")}</div>`;
  all("#script .s").forEach(e => e.onclick = () => { start(+e.dataset.i); });
  $("edb").onclick = () => { stop(); editing = true; drawScript(); };
  if ($("rs")) $("rs").onclick = () => { mem.set(key(), null); segs = parse(scriptOf()); si = 0; drawScript(); };
}
function light(i) { all("#script .s").forEach(e => e.classList.toggle("on", +e.dataset.i === i)); }

/* ── opening and end ── */
const LOGO = '<svg width="140" height="140" viewBox="0 0 200 200" role="img" aria-label="AURA"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#112d4e"/><stop offset="1" stop-color="#3f72af"/></linearGradient></defs><rect width="200" height="200" rx="44" fill="url(#g)"/><path id="lL" d="M48 160 L100 40" stroke="#fff" stroke-width="11" fill="none" stroke-linecap="round" stroke-dasharray="131"/><path id="lR" d="M100 40 L152 160" stroke="#fff" stroke-width="11" fill="none" stroke-linecap="round" stroke-dasharray="131"/><rect id="b0" x="76" width="10" fill="#dbe2ef"/><rect id="b1" x="95" width="10" fill="#dbe2ef"/><rect id="b2" x="114" width="10" fill="#dbe2ef"/></svg>';
const H = [16, 27, 38];
function bar(i, p) { const e = $("b" + i); if (!e) return; const h = Math.max(0, H[i] * p); e.setAttribute("height", h.toFixed(1)); e.setAttribute("y", (140 - h).toFixed(1)); }
function grow(i) { const s = performance.now(); (function f(n) { const p = Math.min(1, (n - s) / 380); bar(i, 1 - Math.pow(1 - p, 3) + .12 * Math.sin(Math.PI * p)); if (p < 1) requestAnimationFrame(f); else bar(i, 1); })(s); }
function tune() {
  if (!$("mus").checked) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) { return; }
  mg = ac.createGain(); mg.connect(ac.destination);
  const t = ac.currentTime + .05, n = (f, d, l, g) => { const o = ac.createOscillator(), a = ac.createGain(); o.type = "triangle"; o.frequency.value = f; a.gain.setValueAtTime(.0001, t + d); a.gain.exponentialRampToValueAtTime(g, t + d + .03); a.gain.exponentialRampToValueAtTime(.0001, t + d + l); o.connect(a); a.connect(mg); o.start(t + d); o.stop(t + d + l + .05); };
  n(130.81, 0, 4.6, .05); n(261.63, .4, 1.2, .09); n(392, .85, 1.2, .09); [523.25, 659.25, 783.99].forEach((f, i) => n(f, 1.4 + i * .36, 1.1, .1)); [261.63, 392, 523.25, 659.25].forEach(f => n(f, 2.7, 2.2, .06));
}
function opening(animate) {
  $("where").textContent = T("opening"); caption(""); drawScript(); dots();
  const kinds = k => Object.values(D.quiz).filter(q => k.includes(q.kind)).length, at = +mem.get("page") || 0;
  $("slide").innerHTML = `<div id="open">${LOGO}<p class="t fade">AURA Learning</p><p class="c fade">${esc(D.meta["course_" + ui])} · ${fmt(T("session"), D.id)}</p><p class="n fade">${esc(D.meta["title_" + ui])}</p><p class="h fade">${esc(D.meta["question_" + ui])}</p><p class="c fade">${fmt(T("sum"), N, kinds(["choice"]), kinds(["fill", "number"]), D.meta.minutes).replace(/\b1 (question|exercice|exercise)s/g, "1 $1")} · ${fmt(T("made"), D.meta.aura_min)}</p>${at ? `<p class="c"><button id="from">${fmt(T("from"), at + 1)}</button></p>` : ""}</div>`;
  if ($("from")) $("from").onclick = () => go(at, true);
  [0, 1, 2].forEach(i => bar(i, 1)); buttons();
  if (!animate) return;
  const me = run, next = ms => timer = setTimeout(() => { if (me === run) go(0, true); }, ms);
  tune();
  const fadeIn = (e, delay) => { if (e.animate) e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 900, delay, fill: "both" }); };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {          /* less motion asked for: nothing moves, all fades in */
    fadeIn(document.querySelector("#open svg"), 200); all("#open .fade").forEach((e, i) => fadeIn(e, 1200 + i * 450)); next(5200); return; }
  const legs = [$("lL"), $("lR")], tx = all("#open .fade"), later = (ms, fn) => setTimeout(() => { if (me === run) fn(); }, ms);
  legs.forEach(e => e.style.strokeDashoffset = "131px"); [0, 1, 2].forEach(i => bar(i, 0)); tx.forEach(e => e.classList.add("hid"));
  legs.forEach((e, i) => {
    if (e.animate) e.animate([{ strokeDashoffset: "131px" }, { strokeDashoffset: "0px" }], { duration: 430, delay: 400 + i * 450, easing: "ease-in-out", fill: "both" });
    else later(400 + i * 450, () => { e.style.transition = "stroke-dashoffset .43s ease-in-out"; e.style.strokeDashoffset = "0px"; }); });
  [0, 1, 2].forEach(i => later(1430 + i * 360, () => grow(i))); tx.forEach((e, i) => later(2500 + i * 300, () => e.classList.remove("hid")));
  next(5400);
}
function ending(speak) {
  $("where").textContent = T("end"); caption(""); drawScript(); dots();
  const E = D.end[ui], n = TASKS.filter(k => solved[k] && solved[k] !== "shown").length;
  $("slide").innerHTML = `<div id="open">${LOGO}<p class="n" style="margin-top:12px">${esc(E.title)}</p><ul>${E.points.map(p => `<li>${p}</li>`).join("")}</ul><p class="c">${fmt(T("answered"), n, TASKS.length)}</p><p class="c">${D.next ? `<a class="go" href="${D.next.href}">${T("nexts")} : ${D.next.id} ${esc(D.next[ui])} ▶</a>` : ""}</p></div>`;
  [0, 1, 2].forEach(i => bar(i, 1)); mem.set("page", "0"); buttons();
  if (!speak) return;
  const list = parse(D.script[$("lang").value].end), me = run; playing = true; buttons();
  (function one(i) {
    if (me !== run) return; si = i; began = performance.now();
    if (i >= list.length) { playing = false; caption(""); buttons(); if (cont() && D.next) countdown(6, () => { location.href = D.next.href + "?play"; }); return; }   /* the next lesson */
    caption(list[i].t); say(list[i].t, () => one(i + 1)); })(0);
}

/* ── controls ── */
$("play").onclick = () => {
  if (page < 0) { if (timer && playing) return; stop(); playing = false; opening(true); return; }
  if (page >= N) { if (counting) location.href = D.next.href + "?play"; else if (playing) { stop(); caption(""); } else go(-1); return; }
  if (playing) { stop(); return; }
  if (!waiting && ended()) { stop(); go(page + 1, true); return; }      /* Continue, without waiting */
  if (waiting) kindOf(page, ["quiz"]).forEach(q => skipped[q.name] = 1);
  if (si >= segs.length && !waiting) { si = 0; setMark(0); }
  start(si);
};
$("next").onclick = () => go(page + 1, true);
$("prev").onclick = () => go(page - 1, false);
$("scr").onclick = () => { showScript = !showScript; $("scr").setAttribute("aria-pressed", showScript); drawScript(); };
$("capx").onclick = () => { $("caps").checked = false; $("caps").onchange(); };
function redraw() { const was = playing; stop(); words(); listVoices(); editing = false;
  if (page < 0) opening(false); else if (page >= N) ending(false); else { const m = mark; dots(); $("where").textContent = fmt(T("of"), page + 1, N); render(); segs = parse(scriptOf()); if (si >= segs.length) si = segs.length; drawScript(); setMark(m); if (was) start(Math.min(si, segs.length - 1)); else buttons(); } }
$("page").onchange = () => { ui = $("page").value; try { localStorage.setItem("aura-learn-lang", ui); } catch (e) {} $("lang").value = ui; pref.set("lang", ui); redraw(); };
$("mode").onchange = () => { pref.set("mode", $("mode").value); hold(); };
$("mus").onchange = () => { lit(); pref.set("mus", $("mus").checked ? "1" : "0"); };
$("lang").onchange = () => { pref.set("lang", $("lang").value); listVoices(); const was = playing; stop(); if (page >= 0 && page < N) { segs = parse(scriptOf()); const i = Math.max(0, segs.findIndex(s => s.m === mark)); si = i; editing = false; drawScript(); if (was) start(i); else buttons(); } };
$("voice").onchange = () => { pref.set("voice-" + $("lang").value, $("voice").value); settle(); if (playing && page >= 0 && page < N) start(si); };
$("rate").onchange = () => { pref.set("rate", $("rate").value); if (playing && page >= 0 && page < N) start(si); };
$("caps").onchange = () => { lit(); pref.set("caps", $("caps").checked ? "1" : "0"); caption(segs[si] && page < N && (playing || si) ? segs[si].t : ""); };
document.addEventListener("keydown", e => { if (/TEXTAREA|SELECT|INPUT|BUTTON/.test(e.target.tagName) && e.key === " ") return; if (/TEXTAREA|SELECT|INPUT/.test(e.target.tagName)) return;
  if (e.key === "c") { $("caps").checked = !$("caps").checked; $("caps").onchange(); }
  if (e.key === "ArrowRight" && page < N) $("next").click(); if (e.key === "ArrowLeft" && page >= 0) $("prev").click(); if (e.key === " ") { e.preventDefault(); $("play").click(); } });
window.addEventListener("pagehide", () => { if (synth) synth.cancel(); });
$("lang").value = pref.get("lang") || ui; if (pref.get("rate")) $("rate").value = pref.get("rate"); if (pref.get("mode")) $("mode").value = pref.get("mode");
for (const k of ["caps", "mus"]) if (pref.get(k)) $(k).checked = pref.get(k) === "1";
if (synth) { synth.getVoices(); synth.onvoiceschanged = listVoices; for (const t of [400, 1200, 3000, 6000]) setTimeout(() => { if (!$("voice").value) listVoices(); }, t); }   /* some devices give their voices late, without saying so */
words(); listVoices(); opening(false);
if (location.search === "?play") { history.replaceState(null, "", location.pathname); timer = setTimeout(() => { listVoices(); go(0, true); }, 1200); }   /* after the lesson before */
</script>
</body>
